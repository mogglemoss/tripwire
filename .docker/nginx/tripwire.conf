server {
    listen       80;
    server_name  localhost;

    # note that these lines are originally from the "location /" block
    root   /opt/app/public;
    index index.php index.html index.htm;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Static assets are requested with ?v=VERSION, so a long cache is safe --
    # a release changes the query string and busts it. Without this every
    # reload re-fetched the full bundle set.
    location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|woff2?|ttf|eot)$ {
        # One Cache-Control only -- `expires` emits its own, which would
        # duplicate the header.
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location /api {
        rewrite ^/api(.*) /api.php?q=$1;
    }

    location ~ \.php$ {
        resolver 127.0.0.11 ipv6=off;
        set $phpFPMHost "php-fpm:9000";

        try_files $uri =404;
        fastcgi_pass $phpFPMHost;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
