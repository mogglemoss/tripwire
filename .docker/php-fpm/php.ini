; Errors should be logged, but not displayed to end users
display_errors = "0"
log_errors = "1"

; Set session path to a directory owned by process user
session.save_path = "/var/lib/php/session"

; Stay signed in. PHP's default deletes a session after 24 idle minutes, which
; signs out every pilot whose tab was asleep or closed for that long. Keep
; sessions, and the cookie that names them, for 30 days (in seconds).
session.gc_maxlifetime = 2592000
session.cookie_lifetime = 2592000

; Keep the session cookie away from page scripts and cross-site requests.
; Lax, not Strict: the return from EVE sign-in is a cross-site navigation and
; must still carry the session.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

; On a site served only over HTTPS, also send the cookie over HTTPS only.
; Left off here because it stops sign-in working over plain HTTP.
;session.cookie_secure = 1
